  <body>
    <div id="root"></div>
    <!-- Preload MediaPipe vision from CDN before React mounts.
         npm package has broken exports with Vite 8; CDN via script tag works. -->
    <script type="module">
      import { FaceLandmarker, HandLandmarker, FilesetResolver } from 'https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/vision_bundle.mjs';
      window.FaceLandmarker = FaceLandmarker;
      window.HandLandmarker = HandLandmarker;
      window.FilesetResolver = FilesetResolver;
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
